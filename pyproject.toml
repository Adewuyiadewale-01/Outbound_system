[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = [
  "state",
  "debug",
  "output",
  "node_modules",
  "dist",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = [
    "E501",   # long lines; the formatter wraps what it can
    "E402",   # sys.path bootstrap before imports; removed by Phase 1 package layout
    "E701",   # legacy one-line statements; normalized during Phase 2 extraction
    "E702",   # same, semicolon statements
    "UP031",  # %-format deliberately used to embed JSON into JS expressions
]

[tool.ruff.lint.isort]
known-first-party = ["helpers", "scripts"]
