<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: transparent;
      overflow: hidden;
      -webkit-user-select: none;
      user-select: none;
    }

    .floating-button {
      width: 52px;
      height: 52px;
      border-radius: 14px;
      background: #171d26;
      box-shadow: 0 7px 20px rgba(15, 23, 42, 0.28), inset 0 1px 0 rgba(255, 255, 255, 0.08);
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      transition: transform 0.2s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.2s ease, background 0.3s ease;
      border: 1px solid rgba(255, 255, 255, 0.12);
      -webkit-app-region: no-drag;
    }

    .floating-button:hover {
      transform: translateY(-1px);
      background: #202836;
      box-shadow: 0 9px 24px rgba(15, 23, 42, 0.34), inset 0 1px 0 rgba(255, 255, 255, 0.1);
    }

    .floating-button:active {
      transform: scale(0.95);
    }

    .floating-button svg {
      width: 24px;
      height: 24px;
      fill: #dfe6f5;
    }
  </style>
</head>
<body>
  <div class="floating-button" id="toggleBtn">
    <!-- Clipboard check list icon -->
    <svg viewBox="0 0 24 24">
      <path d="M19,3H14.82C14.4,1.84 13.3,1 12,1C10.7,1 9.6,1.84 9.18,3H5C3.9,3 3,3.9 3,5V19A2,2 0 0,0 5,21H19A2,2 0 0,0 21,19V5A2,2 0 0,0 19,3M12,3A1,1 0 0,1 13,4A1,1 0 0,1 12,5A1,1 0 0,1 11,4A1,1 0 0,1 12,3M14,17H7V15H14V17M17,13H7V11H17V13M17,9H7V7H17V9Z"/>
    </svg>
  </div>
  <script src="floating.js"></script>
</body>
</html>
